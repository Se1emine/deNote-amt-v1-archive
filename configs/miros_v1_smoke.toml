# Denote-MIROS-v1 smoke — MusicFM-width d_model=1024, shallow

[audio]
sample_rate = 24000
n_fft = 2048
hop_length = 240
n_mels = 128
fmin = 0.0
fmax = 12000.0
mel_eps = 1.0e-5

[encoder]
n_mels = 128
conv_dim = 512
encoder_dim = 1024
encoder_depth = 2
n_heads = 16
ffn_mult = 4
dropout = 0.0
freeze = true

[vocab]
time_bin_sec = 0.01
n_time_bins = 205
n_pitches = 128
n_velocity = 128
n_programs = 8
max_polyphony = 16

[decoder]
d_model = 1024
n_layers = 2
n_heads = 16
d_ff = 4096
max_tokens = 256
dropout = 0.0

[train]
window_sec = 2.0
batch_size = 1
epochs = 1
lr = 0.0003
weight_decay = 0.0001
seed = 42
checkpoint_dir = "runs/miros_smoke"
data_dir = "data/cache/tokens/smoke"
label_smoothing = 0.1
aux_pitch_weight = 0.1

[decode]
beam_size = 1
max_tokens = 256
constrained = true
