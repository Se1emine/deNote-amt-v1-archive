# Tiny Phase 3 corpus smoke (CPU, minutes not hours).
[run]
name = "phase3_corpus_smoke"

[data]
out_dir = "data/raw/phase3_smoke"
render_index = "data/raw/phase3_smoke/render_index.jsonl"
repo_root = "."
midi_dir = "data/raw/midi/clean_midi"
max_midi = 2
babyslakh_dir = "data/raw/babyslakh/babyslakh_16k"
seed = 1

[render]
enabled = true
sample_rate = 24000

[stem]
enabled = true
mixes_per_track = 1
max_instruments = 3
min_instruments = 1

[chunk]
chunk_sec = 4.0
hop_sec = 4.0
min_notes = 1
max_instruments = 3
