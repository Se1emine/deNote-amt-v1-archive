# Phase 3 Job L0 — latent + token cache (MusicFM-width d_model=1024).
# Prerequisite: data/raw/phase3/*.wav + *.notes.json
# Master/real MusicFM: encoder_dim=1024. depth=4 = anti-OOM scaffold on GTX 1070;
# set encoder_depth=12 + weights_dir when true MusicFM-MSD weights are loaded.
#
# Usage:
#   cargo run -p denote-train --release --features cuda -- `
#     --config configs/phase3_cache.toml --job cache-l0 --device cuda

[run]
name = "cache_l0_phase3"
run_dir = "runs/cache_l0_phase3"

[data]
input_dir = "data/raw/phase3"
cache_dir = "data/cache/phase3"
manifest_name = "manifest.jsonl"
train_ratio = 0.8
chunk_sec = 4.0
skip_existing = true

[audio]
sample_rate = 24000

[encoder]
n_mels = 128
conv_dim = 512
encoder_dim = 1024
encoder_depth = 4
n_heads = 16
ffn_mult = 4
dropout = 0.0
# weights_dir = "assets/musicfm_msd"
allow_random_encoder = true

[vocab]
time_bin_sec = 0.01
n_time_bins = 205
n_pitches = 128
n_velocity = 128
n_programs = 8
max_polyphony = 16
