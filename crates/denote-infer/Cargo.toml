[package]
name = "denote-infer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Inference binary: audio → note list JSON/MIDI"

[[bin]]
name = "denote-infer"
path = "src/main.rs"

[features]
default = ["ndarray-backend"]
ndarray-backend = []
cuda = ["burn/cuda"]
wgpu = ["burn/wgpu"]

[dependencies]
anyhow.workspace = true
burn = { workspace = true, features = ["std", "ndarray"] }
clap.workspace = true
denote-audio.workspace = true
denote-data.workspace = true
denote-decode.workspace = true
denote-model = { workspace = true, features = ["legacy-crnn"] }
denote-tokens.workspace = true
env_logger.workspace = true
log.workspace = true
midly.workspace = true
ndarray.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
