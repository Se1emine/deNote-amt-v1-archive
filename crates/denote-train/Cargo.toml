[package]
name = "denote-train"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Training binary for Denote-CRNN-v1"

[[bin]]
name = "denote-train"
path = "src/main.rs"

[features]
default = ["ndarray-backend"]
ndarray-backend = []
cuda = ["burn/cuda"]
wgpu = ["burn/wgpu"]

[dependencies]
anyhow.workspace = true
bincode.workspace = true
burn = { workspace = true, features = ["std", "train", "ndarray"] }
clap.workspace = true
denote-audio.workspace = true
denote-data.workspace = true
denote-decode.workspace = true
denote-eval.workspace = true
denote-model = { workspace = true, features = ["legacy-crnn"] }
denote-tokens.workspace = true
denote-encoder.workspace = true
env_logger.workspace = true
log.workspace = true
ndarray.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
